name: Retrain Model

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: mental-health-env
          environment-file: MLProject/conda.yaml

      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          cd MLProject
          # Buat experiment jika belum ada
          mlflow experiments create -x mental-health-experiment || true
          # Jalankan MLflow project
          mlflow run . --env-manager conda

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Find Model Path
        id: find_model
        run: |
          MODEL_PATH=$(find MLProject/mlruns -name "MLmodel" -type f | head -n 1)
          
          if [ -z "$MODEL_PATH" ]; then
            echo "❌ Model tidak ditemukan!"
            echo "Isi direktori mlruns:"
            ls -la MLProject/mlruns/
            exit 1
          fi
          
          MODEL_DIR=$(dirname "$MODEL_PATH")
          echo "MODEL_DIR=$MODEL_DIR" >> $GITHUB_ENV
          echo "✅ Model ditemukan di: $MODEL_DIR"

      - name: Build Docker Image
        run: |
          mlflow models build-docker \
            -m "$MODEL_DIR" \
            -n mental-health-model \
            --enable-mlserver

      - name: Tag Docker Image
        run: |
          docker tag mental-health-model \
            ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest
          
          docker tag mental-health-model \
            ${{ secrets.DOCKER_USERNAME }}/mental-health-model:${{ github.run_id }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mental-health-model:${{ github.run_id }}
name: Retrain Model

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0
          pip install pandas
          pip install numpy
          pip install scikit-learn

      - name: Run MLProject
        run: |
          cd MLProject
          mlflow run . --env-manager local

      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check Docker Login
        run: |
          docker info

      - name: Show MLflow Structure
        run: |
          cd MLProject
          find mlruns

      - name: Get Model Path
        run: |
          MODEL_PATH=$(find MLProject/mlruns -name MLmodel | head -n 1)

          MODEL_DIR=$(dirname "$MODEL_PATH")

          echo "MODEL_DIR=$MODEL_DIR" >> $GITHUB_ENV

          echo "Model ditemukan di:"
          echo $MODEL_DIR

      - name: Build Docker Image
        run: |
          mlflow models build-docker \
            -m $MODEL_DIR \
            -n mental-health-model

      - name: Tag Docker Image
        run: |
          docker tag mental-health-model \
            ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest
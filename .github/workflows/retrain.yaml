name: Retrain Model

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # SETUP CONDA
      # =========================
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: mental-health-env
          environment-file: MLProject/conda.yaml

      # =========================
      # DEBUG + VERIFY ENV (ANTI ERROR "mlflow not found")
      # =========================
      - name: Debug Environment
        shell: bash -l {0}
        run: |
          which python
          which pip
          pip install mlflow
          which mlflow
          mlflow --version

      # =========================
      # RUN MLflow PROJECT (FIXED)
      # =========================
      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          cd MLProject
          rm -rf mlruns mlflow.db
          mlflow run . -e main

      # =========================
      # Upload artifact (SKILLED REQUIREMENT)
      # =========================
      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns

      # =========================
      # Docker Hub Login
      # =========================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # Find MLflow Model
      # =========================
      - name: Find Model Path
        shell: bash -l {0}
        run: |
          MODEL_PATH=$(find MLProject/mlruns -name "MLmodel" -type f | head -n 1)

          if [ -z "$MODEL_PATH" ]; then
            echo "Model tidak ditemukan"
            ls -R MLProject/mlruns || true
            exit 1
          fi

          MODEL_DIR=$(dirname "$MODEL_PATH")
          echo "MODEL_DIR=$MODEL_DIR" >> $GITHUB_ENV

      # =========================
      # Build Docker Image (ADVANCE REQUIREMENT)
      # =========================
      - name: Build Docker Image
        shell: bash -l {0}
        run: |
          mlflow models build-docker \
            -m "$MODEL_DIR" \
            -n mental-health-model \
          

      # =========================
      # Tag Docker Image
      # =========================
      - name: Tag Docker Image
        run: |
          docker tag mental-health-model ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest
          docker tag mental-health-model ${{ secrets.DOCKER_USERNAME }}/mental-health-model:${{ github.run_id }}

      # =========================
      # Push Docker Image
      # =========================
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mental-health-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mental-health-model:${{ github.run_id }}